# SPDX-License-Identifier: AGPL-3.0-or-later
[graph]
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "wasm32-unknown-unknown"]

[advisories]
version = 2
yanked = "deny"
# "Unmaintained" advisory (not a vulnerability) on a procedural macro used at compile time by Leptos (either_of).
# To re-examine at each Leptos bump.
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "paste (macro de compilation) tire par leptos/either_of ; archive mais sans vulnerabilite" },
    { id = "RUSTSEC-2026-0249", reason = "smartstring (chaines courtes) tire par rhai 1.27, derniere version publiee ; avis 'non maintenu', pas une faille. A reexaminer a chaque montee de Rhai (ADR 0034)" },
    { id = "RUSTSEC-2026-0543", reason = "chrono declare non maintenu le 2026-11-17 (avis d'abandon, pas une faille, aucune version corrigee). Remplacement envisage par jiff ou time : chantier a planifier, a reexaminer a chaque montee de chrono" },
    { id = "RUSTSEC-2026-0555", reason = "chrono-tz, meme avis que chrono (RUSTSEC-2026-0543) ; tire par dominet-automation (lever et coucher du soleil, fuseaux)" },
]

[licenses]
version = 2
# Licences compatible with redistribution under AGPL-3.0-or-later.
allow = [
    "AGPL-3.0-or-later",
    "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
    "ISC", "Unicode-3.0", "Zlib", "MPL-2.0", "CC0-1.0", "0BSD",
    "CDLA-Permissive-2.0", # webpki-roots (Mozilla root certificates), pulled in by sqlx/rustls
    "BSL-1.0", # Boost (permissive, OSI-approved): xxhash-rust, pulled in by server_fn (Leptos)
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies between workspace crates (not published): allowed.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
