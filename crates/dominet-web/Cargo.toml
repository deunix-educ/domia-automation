# SPDX-License-Identifier: AGPL-3.0-or-later
[package]
name = "dominet-web"
description = "Interface Leptos (SSR + hydratation) : composants, pages, i18n, fonctions serveur."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dominet-proto.workspace = true
dominet-domain.workspace = true
leptos.workspace = true
leptos_meta.workspace = true
leptos_router.workspace = true
leptos-fluent.workspace = true
serde.workspace = true
serde_json.workspace = true
# Server side only (`ssr` feature).
dominet-server = { workspace = true, optional = true }
dominet-agent = { workspace = true, optional = true }
dominet-automation = { workspace = true, optional = true }
tower-sessions = { workspace = true, optional = true }
leptos_axum = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
# Browser side only (`hydrate` feature).
wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }
console_error_panic_hook = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true }
js-sys = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }

[features]
default = []
hydrate = ["leptos/hydrate", "dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:console_error_panic_hook", "dep:web-sys", "dep:js-sys"]
ssr = [
  "dep:dominet-server", "dep:dominet-agent", "dep:dominet-automation", "dep:uuid", "dep:chrono", "dep:tower-sessions", "dep:tracing", "dep:leptos_axum", "dep:axum", "dep:tower-http",
  "leptos/ssr", "leptos_meta/ssr", "leptos_router/ssr", "leptos-fluent/ssr", "leptos-fluent/axum",
]

[lints]
workspace = true
