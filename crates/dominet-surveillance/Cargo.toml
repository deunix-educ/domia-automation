[package]
name = "dominet-surveillance"
description = "Cameras : MediaMTX, ONVIF, night mode, enregistrement, mouvement, YOLO."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Fake MediaMTX (tests, demonstration): no contact with a real server.
testing = ["dep:axum"]

[dependencies]
dominet-domain.workspace = true
base64.workspace = true
chrono.workspace = true
getrandom.workspace = true
image.workspace = true
ndarray.workspace = true
ort.workspace = true
roxmltree.workspace = true
sha1.workspace = true
md-5.workspace = true
socket2.workspace = true
axum = { workspace = true, optional = true }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["process", "io-util"] }
tracing.workspace = true

[dev-dependencies]
dominet-surveillance = { path = ".", features = ["testing"] }

[lints]
workspace = true
