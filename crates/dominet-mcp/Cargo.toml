[package]
name = "dominet-mcp"
description = "Serveur MCP de DomiNet : outils de consultation, pilotage et configuration pour un assistant (R11)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
dominet-server.workspace = true
dominet-domain.workspace = true
dominet-proto.workspace = true
rmcp.workspace = true
schemars.workspace = true
axum.workspace = true
tokio.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
base64.workspace = true
uuid.workspace = true
dominet-surveillance.workspace = true

[dev-dependencies]
sqlx.workspace = true
dominet-surveillance = { workspace = true, features = ["testing"] }
dominet-mqtt.workspace = true
dominet-notify = { workspace = true, features = ["testing"] }
dominet-store.workspace = true
reqwest.workspace = true
# Vrai client MCP pour les tests de bout en bout (le meme protocole que Claude Code).
rmcp = { workspace = true, features = ["client", "reqwest", "transport-streamable-http-client", "transport-streamable-http-client-reqwest"] }
