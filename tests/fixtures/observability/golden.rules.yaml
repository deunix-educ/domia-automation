apiVersion: 1
groups:
  - orgId: 1
    name: "G2"
    folder: "Ailleurs"
    interval: "30s"
    rules:
      - uid: "c-other"
        title: "Autre"
        condition: "A"
        data:
          - refId: "A"
            datasourceUid: "prometheus"
            relativeTimeRange:
              from: 60
              to: 0
            model:
              expr: "vector(0)"
              instant: true
              refId: "A"
        for: "2m"
        labels:
          severity: "info"
        annotations:
          summary: "Autre"
        noDataState: "Alerting"
        execErrState: "OK"
        isPaused: false
  - orgId: 1
    name: "DomiNet"
    folder: "DomiNet Alerts"
    interval: "1m"
    rules:
      - uid: "a-sql"
        title: "Canicule — température"
        condition: "A"
        data:
          - refId: "A"
            datasourceUid: "postgresql"
            relativeTimeRange:
              from: 60
              to: 0
            model:
              rawSql: "SELECT 1\nFROM device\nWHERE x > 35"
              format: "table"
              refId: "A"
        for: "5m"
        labels:
          severity: "warning"
        annotations:
          summary: "Chaud"
        noDataState: "OK"
        execErrState: "Error"
        isPaused: false
      - uid: "b-prom"
        title: "Down"
        condition: "A"
        data:
          - refId: "A"
            datasourceUid: "prometheus"
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: "up{job=\"dominet\"} == 0"
              instant: true
              refId: "A"
        for: "1m"
        labels:
          severity: "critical"
        annotations:
          summary: "Down"
          description: "Scrape en echec"
        noDataState: "NoData"
        execErrState: "Error"
        isPaused: false
