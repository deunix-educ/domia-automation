# `cargo audit` exceptions (reads the whole Cargo.lock, including optional dependencies that are never compiled).
[advisories]
ignore = [
    # libsqlite3-sys 0.37: only present in Cargo.lock (sqlx-macros's optional SQLite driver); absent from all the compiled graphs
    # (`cargo tree -i libsqlite3-sys --target all` does not show it) and DomiNet only uses PostgreSQL. `cargo deny` (real graph) is green.
    # To lift at the next sqlx bump that raises libsqlite3-sys >= 0.39.
    "RUSTSEC-2026-0459",
]
