#
# Le serveur (rendu HTML) et le WebAssembly (hydratation) DOIVENT etre compiles de la meme facon, sinon le HTML ne
# contient pas les marqueurs que le WASM attend, l'hydratation echoue et l'interface reste inerte (boutons inactifs). Deux
# reglages de compilation sont concernes ; `cargo leptos` les impose a ses propres compilations, un `cargo build` ou
# `cargo test` ordinaire (donc `make ci`, qui recompile `target/debug/dominet`) ne les avait pas :
#
#  * `--cfg erase_components` (RUSTFLAGS) : change le HTML rendu. `cargo leptos` l'ajoute en dev ; on le fixe pour tout.
#  * `LEPTOS_OUTPUT_NAME` : nom du fichier WASM demande par la page (`dominet.wasm`, sinon `dominet_bg.wasm` : 404). Doit
#    rester egal a `output-name` de `[[workspace.metadata.leptos]]` (Cargo.toml).
#
# Un test (`crates/dominet/tests/ui.rs`) verifie le nom du WASM et la presence des marqueurs d'hydratation.
[build]
rustflags = ["--cfg", "erase_components"]

[env]
LEPTOS_OUTPUT_NAME = "dominet"
