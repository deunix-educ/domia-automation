#
# The server (HTML rendering) and the WebAssembly (hydration) MUST be compiled the same way, otherwise the HTML does not
# contain the markers the WASM expects, hydration fails and the interface stays inert (inactive buttons). Two
# compilation settings are concerned; `cargo leptos` imposes them on its own builds, an ordinary `cargo build` or
# `cargo test` (hence `make ci`, which recompiles `target/debug/dominet`) did not have them:
#
#  * `--cfg erase_components` (RUSTFLAGS): changes the rendered HTML. `cargo leptos` adds it in dev; we set it for everything.
#  * `LEPTOS_OUTPUT_NAME`: name of the WASM file requested by the page (`dominet.wasm`, otherwise `dominet_bg.wasm`: 404). Must
#    stay equal to `output-name` of `[[workspace.metadata.leptos]]` (Cargo.toml).
#
# A test (`crates/dominet/tests/ui.rs`) checks the WASM name and the presence of the hydration markers.
[build]
rustflags = ["--cfg", "erase_components"]

[env]
LEPTOS_OUTPUT_NAME = "dominet"
