# SPDX-License-Identifier: AGPL-3.0-or-later
# Production and demo MediaMTX (1.21.3). The API (9997), the metrics (9998) and publishing are only accepted from the Docker network
# and the machine (cameras: MediaMTX pulls their stream, they do not publish); reading (RTSP 8554, WebRTC) is open,
# ICE addresses announced: MTX_WEBRTCADDITIONALHOSTS (see the compose).
logLevel: info
logDestinations: [stdout]
api: true
apiAddress: :9997
metrics: yes
metricsAddress: :9998
authInternalUsers:
  - user: any
    pass:
    ips: []
    permissions:
      - {action: read, path: ""}
      - {action: playback, path: ""}
  - user: any
    pass:
    ips: ["127.0.0.1", "::1", "172.16.0.0/12", "10.0.0.0/8"]
    permissions:
      - {action: publish, path: ""}
      - {action: api, path: ""}
      - {action: metrics, path: ""}
rtsp: true
rtspAddress: :8554
rtmp: false
hls: false
srt: false
moq: false
webrtc: true
webrtcAddress: :8889
webrtcLocalTCPAddress: :8189
webrtcLocalUDPAddress: :8189
record: no
# Recording: one fMP4 segment per minute (RECORDINGS_SEGMENT_DURATION=60 on the DomiNet side), one folder per camera. A camera path
# only records if DomiNet sets `record: true` on it (continuous or motion mode, or manual start).
recordFormat: fmp4
recordPath: /recordings/%path/%Y-%m-%d_%H-%M-%S-%f
recordPartDuration: 1s
recordSegmentDuration: 60s
recordDeleteAfter: 0s
paths:
  "~.*": {}
