# SPDX-License-Identifier: AGPL-3.0-or-later
# Production and demo MediaMTX (1.21.3). Cameras are pulled by MediaMTX (they do not publish); reading (RTSP 8554, WebRTC) needs an
# account (see below). ICE addresses announced: MTX_WEBRTCADDITIONALHOSTS (see the compose).
logLevel: info
logDestinations: [stdout]
api: true
apiAddress: :9997
metrics: yes
metricsAddress: :9998
# Authentication (ADR 0064): every read (RTSP, WebRTC) and every publication is decided by DomiNet, which accepts an account's
# viewing token or personal credential, or the service credential of its own `video` role. `authInternalUsers` is ignored in this mode.
# The API, the metrics and the profiler skip the HTTP call: DomiNet itself calls the API while it starts (before it can answer)
# and Prometheus must keep scraping when it is down. Their ports (9997, 9998) are NOT published on the host.
# `publish` is NOT excluded: the exclusion has no address filter, so it would open publishing to the whole LAN (RTSP 8554 is published).
authMethod: http
authHTTPAddress: http://dominet:8000/internal/mediamtx/auth
authHTTPExclude:
  - {action: api}
  - {action: metrics}
  - {action: pprof}
rtsp: true
rtspAddress: :8554
rtmp: false
hls: false
srt: false
moq: false
webrtc: true
webrtcAddress: :8889
webrtcLocalTCPAddress: :8189
webrtcLocalUDPAddress: :8189
record: no
# Recording: one fMP4 segment per minute (RECORDINGS_SEGMENT_DURATION=60 on the DomiNet side), one folder per camera. A camera path
# only records if DomiNet sets `record: true` on it (continuous or motion mode, or manual start).
recordFormat: fmp4
recordPath: /recordings/%path/%Y-%m-%d_%H-%M-%S-%f
recordPartDuration: 1s
recordSegmentDuration: 60s
recordDeleteAfter: 0s
paths:
  "~.*": {}
