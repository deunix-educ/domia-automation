# SPDX-License-Identifier: AGPL-3.0-or-later
# Dev MediaMTX (spikes 3 and 4). Open access: ports published on 127.0.0.1 only.
logLevel: info
logDestinations: [stdout]
api: true
apiAddress: :9997
authInternalUsers:
  - user: any
    pass:
    ips: []
    permissions:
      - {action: publish, path: ""}
      - {action: read, path: ""}
      - {action: playback, path: ""}
      - {action: api, path: ""}
      - {action: metrics, path: ""}
rtsp: true
rtspAddress: :8554
rtmp: false
hls: false
webrtc: true
webrtcAddress: :8889
webrtcLocalTCPAddress: :8189
webrtcLocalUDPAddress: :8189
# Addresses announced as ICE candidates (the dev browser runs on the host).
webrtcAdditionalHosts: [127.0.0.1]
record: no
# Recording (R6 lot 7): one fMP4 segment every 10 s in dev (60 s in production), one folder per camera.
# A camera path only records if DomiNet sets `record: true` on it (continuous or motion mode, or manual start).
recordFormat: fmp4
recordPath: /recordings/%path/%Y-%m-%d_%H-%M-%S-%f
recordPartDuration: 1s
recordSegmentDuration: 10s
recordDeleteAfter: 0s
paths:
  "~.*": {}
