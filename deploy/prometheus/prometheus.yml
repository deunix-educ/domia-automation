# DomiNet's Prometheus (R7 lot 3). The rules (`rules.yml`) are written by DomiNet into the shared volume `prometheus-rules`
# (PROMETHEUS_RULES_PATH) then reloaded by `POST /-/reload` (Prometheus started with --web.enable-lifecycle).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/rules.yml

scrape_configs:
  # DomiNet: separate /metrics listener (METRICS_ADDR, 9100), never published on the host (ADR 0051).
  - job_name: dominet
    static_configs:
      - targets: ['dominet:9100']
    metrics_path: /metrics

  # MediaMTX 1.21 (`metrics: yes`, port 9998 on the Docker network).
  - job_name: mediamtx
    static_configs:
      - targets: ['mediamtx:9998']
    metrics_path: /metrics
