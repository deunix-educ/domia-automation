# PRODUCTION overlay (with `docker-compose.yml`): nginx in TLS in front of the application, LAN ports, automatic restart,
# `zigbee` (USB dongle) and `vpn` (wg-easy) profiles, Adminer on loopback. Use `make prod-deploy` (never on the dev machine
# without a project and shifted ports: see DEPLOY.md).
services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${CERTS_DIR:-../certs}:/certs:ro
    depends_on:
      dominet: {condition: service_healthy}
      grafana: {condition: service_healthy}
      mediamtx: {condition: service_started}
    networks: [dominet-net]

  dominet:
    restart: unless-stopped
    # A request's client is the one nginx announces; only the Docker network is trusted (TRUSTED_PROXIES).
    environment:
      COOKIE_SECURE: "true"
      CUSTOM_CSS: /custom/custom.css
    # Appearance customisation: `deploy/custom/custom.css` (to create from `custom.css.example`, ignored by git), re-read at each load.
    volumes:
      - ./custom:/custom:ro
    # Hardware video decoding (VAAPI): `make prod-init` (or `make prod-video` on an existing installation) writes VIDEO_DEVICE=/dev/dri
    # and RENDER_GID (group owning /dev/dri/renderD128 on the host). Without them, /dev/null is mounted instead: /dev/dri/renderD128
    # does not exist in the container and decoding stays in software (a compose file cannot ignore an absent device).
    devices:
      - ${VIDEO_DEVICE:-/dev/null}:/dev/dri
    group_add:
      - "${RENDER_GID:-65534}"

  dominet-discovery:
    restart: unless-stopped

  postgres:
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD requis (make prod-init)}

  reductstore:
    restart: unless-stopped
    environment:
      RS_API_TOKEN: ${REDUCTSTORE_TOKEN:?REDUCTSTORE_TOKEN requis (make prod-init)}

  mosquitto:
    restart: unless-stopped
    environment:
      MQTT_PASSWORD: ${MQTT_PASSWORD:?MQTT_PASSWORD requis (make prod-init)}
    # Host port 1883 = the single listener (mandatory password, never anonymous): LAN clients connect with their account.
    ports:
      - "${MQTT_LAN_PORT:-1883}:1883"

  mediamtx:
    restart: unless-stopped
    ports:
      - "8554:8554"        # RTSP (VLC, applications)
      - "8189:8189/udp"    # WebRTC ICE
      - "8189:8189/tcp"
    environment:
      # Hosts announced to the browser for the video stream (ICE candidates): LAN name + IP(s) reachable by the VPN clients.
      MTX_WEBRTCADDITIONALHOSTS: ${WEBRTC_ADDITIONAL_HOSTS:-${LAN_DOMAIN:-localhost}}

  prometheus:
    restart: unless-stopped

  grafana:
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?GRAFANA_PASSWORD requis (make prod-init)}

  # Database administration, reachable only from the machine. Remotely: ssh -L 8181:127.0.0.1:8181 <user>@<server>.
  adminer:
    image: adminer:4.8.1
    profiles: [adminer]
    restart: unless-stopped
    ports: ["127.0.0.1:8181:8080"]
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: galkaev
    depends_on:
      postgres: {condition: service_healthy}
    networks: [dominet-net]

  # `zigbee` profile: active if the dongle (ZIGBEE_DEVICE) is present. Interface on 8080, protected by a token.
  zigbee2mqtt:
    image: koenkk/zigbee2mqtt:2.1.1
    profiles: [zigbee]
    restart: unless-stopped
    ports: ["8080:8080"]
    environment:
      TZ: ${TZ:-Europe/Paris}
      ZIGBEE2MQTT_CONFIG_MQTT_USER: ${MQTT_USER:-dominet}
      ZIGBEE2MQTT_CONFIG_MQTT_PASSWORD: ${MQTT_PASSWORD}
      # The variables of the zigbee and vpn profiles are checked by `make prod-guard` (a compose file does not refuse a variable of an inactive profile).
      ZIGBEE2MQTT_CONFIG_FRONTEND_AUTH_TOKEN: ${ZIGBEE_AUTH_TOKEN:-}
    volumes:
      - ./zigbee2mqtt:/app/data
      - /run/udev:/run/udev:ro
    devices:
      - ${ZIGBEE_DEVICE:-/dev/ttyUSB0}:/dev/ttyUSB0
    depends_on:
      mosquitto: {condition: service_healthy}
    networks: [dominet-net]

  # `vpn` profile: remote access through WireGuard (host network, iptables-nft). Active if WG_ADMIN_HASH is set.
  wg-easy:
    image: ghcr.io/wg-easy/wg-easy:14
    profiles: [vpn]
    restart: unless-stopped
    network_mode: host
    cap_add: [NET_ADMIN, SYS_MODULE]
    volumes:
      - wg-easy-data:/etc/wireguard
      - /lib/modules:/lib/modules:ro
    environment:
      WG_HOST: ${DYNDNS_HOST:-}
      PASSWORD_HASH: ${WG_ADMIN_HASH:-}
      WG_DEFAULT_DNS: "1.1.1.1"
      WG_DEFAULT_ADDRESS: ${WG_DEFAULT_ADDRESS:-10.20.0.x}
      # Routes sent to the clients: tunnel + LAN to reach DomiNet. Distinct from WG_SUBNET.
      WG_ALLOWED_IPS: ${WG_ALLOWED_IPS:-10.20.0.0/24}
      WG_MTU: "1420"
      WG_PERSISTENT_KEEPALIVE: "25"
      UI_TRAFFIC_STATS: "true"
      # iptables-nft (nf_tables) works on all modern kernels, unlike iptables-legacy.
      WG_POST_UP: "/usr/sbin/iptables-nft -t nat -A POSTROUTING -s ${WG_SUBNET:-10.20.0.0/24} -j MASQUERADE; /usr/sbin/iptables-nft -A FORWARD -i wg0 -j ACCEPT; /usr/sbin/iptables-nft -A FORWARD -o wg0 -j ACCEPT"
      WG_POST_DOWN: "/usr/sbin/iptables-nft -t nat -D POSTROUTING -s ${WG_SUBNET:-10.20.0.0/24} -j MASQUERADE; /usr/sbin/iptables-nft -D FORWARD -i wg0 -j ACCEPT; /usr/sbin/iptables-nft -D FORWARD -o wg0 -j ACCEPT"

volumes:
  wg-easy-data:
