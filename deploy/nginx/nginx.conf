# Production nginx: TLS (mkcert certificate, `make certs`), application + WebSocket, Grafana (/grafana/), MediaMTX WebRTC (/webrtc/),
# CA to install on the devices (/dominet-ca.crt).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    server_name _;
    # Only the authority's certificate can be downloaded in clear (a new device does not have the CA yet).
    location = /dominet-ca.crt {
        alias /certs/dominet-ca.crt;
        default_type application/x-x509-ca-cert;
        add_header Content-Disposition 'attachment; filename="dominet-ca.crt"';
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /certs/cert.pem;
    ssl_certificate_key /certs/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 64m;

    resolver 127.0.0.11 valid=10s;

    # Grafana (keeps the /grafana/ prefix: serve_from_sub_path=true)
    location /grafana/ {
        set $grafana http://grafana:3000;
        proxy_pass $grafana;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
    }

    # MediaMTX WebRTC (strips the /webrtc/ prefix)
    location /webrtc/ {
        set $mediamtx http://mediamtx:8889;
        rewrite ^/webrtc/(.*)$ /$1 break;
        proxy_pass $mediamtx;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # mkcert CA (public file): to download from each device so that it trusts the certificate
    location = /dominet-ca.crt {
        alias /certs/dominet-ca.crt;
        default_type application/x-x509-ca-cert;
        add_header Content-Disposition 'attachment; filename="dominet-ca.crt"';
    }

    # DomiNet (application + WebSocket)
    location / {
        set $app http://dominet:8000;
        proxy_pass $app;
        proxy_http_version 1.1;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
    }
}
