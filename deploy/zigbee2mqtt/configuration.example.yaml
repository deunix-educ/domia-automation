# Zigbee2MQTT configuration (`zigbee` profile): copied to `deploy/zigbee2mqtt/configuration.yaml` by `make prod-init`
# if it does not exist. The folder is mounted writable (Zigbee2MQTT keeps its devices and network keys there).
# The MQTT password and the interface token come from .env (ZIGBEE2MQTT_CONFIG_* variables of the compose), not from here.
homeassistant: false
permit_join: false

mqtt:
  base_topic: zigbee2mqtt
  server: mqtt://mosquitto:1883

serial:
  # Port as it appears INSIDE the container (the compose binds ZIGBEE_DEVICE to /dev/ttyUSB0)
  port: /dev/ttyUSB0
  # adapter: ezsp  # uncomment for a Sonoff Zigbee 3.0 USB dongle (EZSPv8 firmware)
  # adapter: zstack  # uncomment for a CC2652/CC1352 dongle

frontend:
  enabled: true
  port: 8080
  host: 0.0.0.0

advanced:
  log_level: info
  # GENERATE: Zigbee2MQTT draws random values at first start then writes them here (do not
  # lose them: without them, all the devices have to be re-paired). Zigbee2MQTT's default values
  # are the same for everyone and may collide with another network.
  pan_id: GENERATE
  ext_pan_id: GENERATE
  network_key: GENERATE
  # Channel 25: outside the Wi-Fi channels 1/6/11 (Zigbee channel 11 overlaps Wi-Fi channel 1).
  channel: 25
  homeassistant_legacy_entity_attributes: false
  legacy_api: false
  legacy_availability_payload: false
