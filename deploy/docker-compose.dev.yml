# DEV overlay (with `docker-compose.yml`): throw-away stack where only the infrastructure services run; DomiNet itself
# is launched from the sources (`make dev-run`, no code in a container). All the ports are published on 127.0.0.1 with a
# shift (1xxxx) so as never to conflict with another stack. No volume shared with production.
# Use `make dev-up` (which sets the dev secrets and starts postgres, reductstore, mosquitto, mediamtx).
name: dominet-dev

services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dominet-dev}
    ports: !override ["127.0.0.1:15432:5432"]

  reductstore:
    environment:
      RS_API_TOKEN: ${REDUCTSTORE_TOKEN:-dominet-dev-token}
    ports: ["127.0.0.1:18383:8383"]
    depends_on: !reset null

  # Dev broker: anonymous on its single listener, loopback on the host side.
  mosquitto:
    entrypoint: ["/docker-entrypoint.sh", "mosquitto", "-c", "/mosquitto/config/mosquitto.conf"]
    ports: ["127.0.0.1:11883:1883"]
    volumes:
      - ./mosquitto/mosquitto.dev.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -t '$$SYS/broker/uptime' -C 1 -W 3 >/dev/null || exit 1"]

  mediamtx:
    ports:
      - "127.0.0.1:18554:8554"   # RTSP
      - "127.0.0.1:18889:8889"   # WebRTC / WHEP (HTTP)
      - "127.0.0.1:19997:9997"   # API
      # ICE: MediaMTX announces its internal port to the browser, so it must be published unchanged
      # (no 1xxxx shift): 8189 UDP and TCP on the loopback.
      - "127.0.0.1:8189:8189/udp"
      - "127.0.0.1:8189:8189/tcp"
    # Recorded segments: the user's folder (the video role reads them then deletes them after archiving into ReductStore).
    user: "${DEV_UID:-1000}:${DEV_GID:-1000}"
    depends_on: !reset null
    volumes:
      - ./mediamtx/mediamtx.dev.yml:/mediamtx.yml:ro
      - ./recordings-dev:/recordings

  # Dev observability (`observability` profile, make dev-observability): Prometheus and Grafana on 19090 and 13000.
  prometheus:
    profiles: [observability]
    ports: ["127.0.0.1:19090:9090"]
    depends_on: !reset null

  grafana:
    profiles: [observability]
    ports: ["127.0.0.1:13000:3000"]
    depends_on: !reset null
