apiVersion: 1

providers:
  - name: DomiNet
    orgId: 1
    type: file
    disableDeletion: false
    editable: true
    options:
      path: /etc/grafana/provisioning/dashboards

  # Device dashboards generated by DomiNet (a device's page) in a shared volume (GRAFANA_DASHBOARDS_DIR).
  - name: DomiNet appareils
    orgId: 1
    type: file
    disableDeletion: false
    editable: true
    options:
      path: /var/lib/dominet-dashboards
