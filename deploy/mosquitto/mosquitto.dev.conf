# Dev broker: anonymous, loopback only on the host side (see the compose).
listener 1883
protocol mqtt
allow_anonymous true
# Per-client queue: 1000 messages by default, beyond which Mosquitto DROPS the QoS 1 messages of a subscriber slower than
# the flow ("Outgoing messages are being dropped"). DomiNet slows its reading when loaded: the queue must absorb it.
max_queued_messages 100000
persistence true
persistence_location /mosquitto/data/
log_dest stdout
