# Broker de dev : anonyme, loopback uniquement cote hote (voir compose).
listener 1883
protocol mqtt
allow_anonymous true
# File d'attente par client : 1 000 messages par defaut, au-dela Mosquitto JETTE les messages QoS 1 d'un abonne plus lent que
# le flux (« Outgoing messages are being dropped »). DomiNet ralentit la lecture quand il est charge : la file doit absorber.
max_queued_messages 100000
persistence true
persistence_location /mosquitto/data/
log_dest stdout
